<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca de Briefings de Copy</title>
  <meta name="description" content="Organize os briefings de Copy da sua marca: referência em vídeo ou imagem + a copy escrita.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
</head>
<body>
  <!-- ===== Cabeçalho ===== -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <span class="brand__mark">✍️</span>
        <div class="brand__text">
          <h1>Briefings de Copy</h1>
          <p>Sua biblioteca de referências + copy</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-theme" class="btn btn--icon" title="Alternar tema" aria-label="Alternar tema">🌙</button>
        <button id="btn-export" class="btn btn--ghost" title="Exportar backup (JSON)">⬇️ Exportar</button>
        <button id="btn-import" class="btn btn--ghost" title="Importar backup (JSON)">⬆️ Importar</button>
        <input type="file" id="import-file" accept="application/json" hidden>
        <button id="btn-new" class="btn btn--primary">＋ Novo briefing</button>
      </div>
    </div>

    <!-- ===== Barra de busca e filtros ===== -->
    <div class="toolbar">
      <div class="search">
        <span class="search__icon">🔎</span>
        <input type="search" id="search" placeholder="Buscar por título, copy, campanha ou tag…" autocomplete="off">
      </div>
      <div class="filters">
        <select id="filter-status" class="select" aria-label="Filtrar por status">
          <option value="">Todos os status</option>
          <option value="Rascunho">Rascunho</option>
          <option value="Em revisão">Em revisão</option>
          <option value="Aprovado">Aprovado</option>
          <option value="Publicado">Publicado</option>
        </select>
        <select id="filter-type" class="select" aria-label="Filtrar por tipo">
          <option value="">Vídeo e imagem</option>
          <option value="video">Só vídeo</option>
          <option value="imagem">Só imagem</option>
        </select>
        <select id="filter-tag" class="select" aria-label="Filtrar por tag">
          <option value="">Todas as tags</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ===== Conteúdo ===== -->
  <main class="container">
    <div id="stats" class="stats"></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>
      <div class="empty__art">🗂️</div>
      <h2>Nenhum briefing por aqui</h2>
      <p>Crie seu primeiro briefing ou ajuste os filtros de busca.</p>
      <button class="btn btn--primary" onclick="document.getElementById('btn-new').click()">＋ Criar briefing</button>
    </div>
  </main>

  <!-- ===== Modal: detalhe do briefing ===== -->
  <div id="modal-detail" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel modal__panel--wide" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button class="modal__close" data-close aria-label="Fechar">✕</button>
      <div id="detail-body" class="detail"></div>
    </div>
  </div>

  <!-- ===== Modal: formulário criar/editar ===== -->
  <div id="modal-form" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="form-title">
      <button class="modal__close" data-close aria-label="Fechar">✕</button>
      <h2 id="form-title" class="modal__title">Novo briefing</h2>

      <form id="brief-form" class="form">
        <input type="hidden" id="f-id">

        <label class="field">
          <span class="field__label">Título <em>*</em></span>
          <input type="text" id="f-titulo" required placeholder="Ex.: Reels — Lançamento coleção verão">
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field__label">Campanha / Produto</span>
            <input type="text" id="f-campanha" placeholder="Ex.: Coleção Verão 2026">
          </label>
          <label class="field">
            <span class="field__label">Status</span>
            <select id="f-status" class="select">
              <option>Rascunho</option>
              <option>Em revisão</option>
              <option>Aprovado</option>
              <option>Publicado</option>
            </select>
          </label>
        </div>

        <div class="field">
          <span class="field__label">Tipo de referência</span>
          <div class="segmented">
            <label><input type="radio" name="tipo" value="video" checked> 🎬 Vídeo</label>
            <label><input type="radio" name="tipo" value="imagem"> 🖼️ Imagem</label>
          </div>
        </div>

        <label class="field">
          <span class="field__label">Link da referência</span>
          <input type="url" id="f-url" placeholder="YouTube, Vimeo, Google Drive ou link da imagem">
          <span class="field__hint">Cole o link do vídeo ou da imagem. Para imagem, você também pode subir um arquivo abaixo.</span>
        </label>

        <label class="field" id="upload-field">
          <span class="field__label">Ou subir uma imagem</span>
          <input type="file" id="f-imagem" accept="image/*">
          <span class="field__hint">A imagem fica salva no seu navegador. Prefira links para arquivos grandes.</span>
        </label>
        <div id="upload-preview" class="upload-preview" hidden></div>

        <label class="field">
          <span class="field__label">Headline</span>
          <input type="text" id="f-headline" placeholder="A chamada principal da peça">
        </label>

        <label class="field">
          <span class="field__label">Copy <em>*</em></span>
          <textarea id="f-copy" rows="6" required placeholder="Escreva aqui a copy completa…"></textarea>
        </label>

        <label class="field">
          <span class="field__label">CTA (chamada para ação)</span>
          <input type="text" id="f-cta" placeholder="Ex.: Compre agora / Saiba mais">
        </label>

        <label class="field">
          <span class="field__label">Tags</span>
          <input type="text" id="f-tags" placeholder="Separe por vírgula. Ex.: Reels, Feed, Anúncio">
        </label>

        <label class="field">
          <span class="field__label">Observações</span>
          <textarea id="f-obs" rows="2" placeholder="Notas internas, aprovações, contexto…"></textarea>
        </label>

        <div class="form__actions">
          <button type="button" class="btn btn--danger-ghost" id="btn-delete" hidden>Excluir</button>
          <div class="spacer"></div>
          <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar briefing</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast" hidden></div>

  <script src="assets/app.js"></script>
</body>
</html>
